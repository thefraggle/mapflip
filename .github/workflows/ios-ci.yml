name: iOS CI

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'iosApp/**'
      - '.github/workflows/ios-ci.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: iOS Unit Tests
    runs-on: macos-14

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Check if iOS project exists
        id: check_ios
        run: |
          if [ -d "iosApp/MapFlip/MapFlip.xcodeproj" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "iosApp directory not tracked or present in checkout"
          fi

      - name: Select Xcode Version
        if: steps.check_ios.outputs.exists == 'true'
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Run Xcode Tests
        if: steps.check_ios.outputs.exists == 'true'
        run: |
          xcodebuild test \
            -project iosApp/MapFlip/MapFlip.xcodeproj \
            -scheme MapFlip \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            CODE_SIGNING_ALLOWED=NO
